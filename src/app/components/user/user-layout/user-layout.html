<div class="min-h-screen bg-auto-black pt-28 pb-12 px-4 md:px-8">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-8 items-start">

        <!-- Sidebar (Floating Glass Panel) -->
        <aside
            class="hidden md:flex flex-col w-64 flex-shrink-0 sticky top-32 bg-[#111111] border border-white/10 rounded-2xl overflow-hidden shadow-2xl z-10">

            <!-- Perron Style Header -->
            <div
                class="px-6 py-8 border-b border-white/5 bg-gradient-to-b from-white/[0.03] to-transparent relative overflow-hidden">
                <!-- Abstract Background Element -->
                <div
                    class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl pointer-events-none">
                </div>

                <div class="relative z-10">
                    <!-- Date -->
                    <p class="text-[10px] font-bold text-gray-400 tracking-[0.2em] uppercase mb-1">
                        {{ today | date:'EEEE, MMM d' }}
                    </p>

                    <!-- Title -->
                    <h2
                        class="text-2xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-200 to-gray-500 mb-3 tracking-tighter">
                        MI<span class="text-auto-accent">GARAGE</span>
                    </h2>

                    <!-- Role Badge -->
                    <div class="flex items-center">
                        <span
                            class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-blue-500/10 border border-blue-500/30 text-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.2)]">
                            Miembro Premium
                        </span>
                    </div>
                </div>
            </div>

            <nav class="p-3 space-y-1">
                <!-- Dashboard / My Garage -->
                <a routerLink="/dashboard" routerLinkActive="bg-auto-accent text-white shadow-lg shadow-auto-accent/20"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 group">
                    <svg class="w-5 h-5 mr-3 transition-colors" [class.text-white]="rld.isActive"
                        #rld="routerLinkActive" routerLinkActive fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                        </path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Mi Garage</span>
                </a>

                <!-- Book Services -->
                <a routerLink="/services" routerLinkActive="bg-auto-accent text-white shadow-lg shadow-auto-accent/20"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 group">
                    <svg class="w-5 h-5 mr-3 transition-colors" [class.text-white]="rls.isActive"
                        #rls="routerLinkActive" routerLinkActive fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Agendar Servicio</span>
                </a>
            </nav>

            <div class="p-3 border-t border-white/5 mt-auto">
                <button (click)="logout()"
                    class="flex items-center w-full px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all group">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 min-w-0">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
