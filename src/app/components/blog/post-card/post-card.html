<article [routerLink]="['/blog', post.id]"
    class="group relative bg-auto-carbon rounded-xl overflow-hidden border border-white/5 hover:border-auto-accent/50 transition-all duration-300 hover:shadow-2xl hover:shadow-auto-accent/10 hover:-translate-y-1 cursor-pointer">
    <div class="aspect-video overflow-hidden">
        <img [src]="post.image" [alt]="post.title"
            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
    </div>
    <div class="p-6">
        <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-bold text-auto-accent uppercase tracking-wider">{{ post.category }}</span>
            <span class="text-xs text-gray-500">{{ post.date }}</span>
        </div>
        <h3 class="text-xl font-bold mb-3 group-hover:text-auto-accent transition-colors">{{ post.title }}</h3>
        <p class="text-gray-400 text-sm mb-4 line-clamp-2">{{ post.excerpt }}</p>
        <div class="flex items-center text-sm font-medium text-white group-hover:translate-x-1 transition-transform">
            Read Article
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
            </svg>
        </div>
    </div>
</article>
