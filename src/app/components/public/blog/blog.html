<div class="container mx-auto px-6 py-28">
    <div class="mb-12 text-center">
        <h2 class="text-3xl font-bold mb-4 text-white">Últimas Publicaciones</h2>
        <div class="h-1 w-20 bg-auto-accent mx-auto rounded-full"></div>
    </div>

    @if (posts().length === 0) {
    <div class="text-center text-gray-500 py-12">
        Aún no hay artículos publicados. ¡Mantente al tanto!
    </div>
    }

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        @for (post of posts(); track post.id) {
        <app-post-card [post]="post"></app-post-card>
        }
    </div>
</div>
