<div class="min-h-screen bg-auto-black pt-32 pb-12 px-4 md:px-8">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-8 items-start">

        <!-- Sidebar (Floating Glass Panel) -->
        <aside
            class="hidden md:flex flex-col w-64 flex-shrink-0 sticky top-32 bg-[#111111] border border-white/10 rounded-2xl overflow-hidden shadow-2xl z-10">

            <!-- Perron Style Header -->
            <div
                class="px-6 py-8 border-b border-white/5 bg-gradient-to-b from-white/[0.03] to-transparent relative overflow-hidden">
                <!-- Abstract Background Element -->
                <div
                    class="absolute -top-10 -right-10 w-32 h-32 bg-auto-accent/10 rounded-full blur-3xl pointer-events-none">
                </div>

                <div class="relative z-10">
                    <!-- Date -->
                    <p class="text-[10px] font-bold text-gray-400 tracking-[0.2em] uppercase mb-1">
                        {{ today | date:'EEEE, MMM d' }}
                    </p>

                    <!-- Title -->
                    <h2
                        class="text-2xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-200 to-gray-500 mb-3 tracking-tighter">
                        Mi<span class="text-auto-accent"> GARAGE</span>
                    </h2>

                    <!-- Role Badge -->
                    <div class="flex items-center">
                        <span
                            class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-auto-accent/10 border border-auto-accent/30 text-auto-accent shadow-[0_0_10px_rgba(220,38,38,0.2)]">
                            {{ profile()?.role || 'Administrador' }}
                        </span>
                    </div>
                </div>
            </div>

            <nav class="p-3 space-y-1">
                <!-- Dashboard -->
                <a routerLink="/admin/dashboard"
                    routerLinkActive="bg-auto-accent text-white shadow-lg shadow-auto-accent/20"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 group">
                    <svg class="w-5 h-5 mr-3 transition-colors" [class.text-white]="rla.isActive"
                        #rla="routerLinkActive" routerLinkActive fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                        </path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Inicio</span>
                </a>

                <!-- Blog Posts -->
                <a routerLink="/admin/blog" routerLinkActive="bg-auto-accent text-white shadow-lg shadow-auto-accent/20"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 group">
                    <svg class="w-5 h-5 mr-3 transition-colors" routerLinkActive #rlb="routerLinkActive"
                        [class.text-white]="rlb.isActive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z">
                        </path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Blog</span>
                </a>

                <!-- Services -->
                <a routerLink="/admin/services"
                    routerLinkActive="bg-auto-accent text-white shadow-lg shadow-auto-accent/20"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 group">
                    <svg class="w-5 h-5 mr-3 transition-colors" routerLinkActive #rls="routerLinkActive"
                        [class.text-white]="rls.isActive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Servicios CRM</span>
                </a>

                <!-- Testimonials -->
                <a routerLink="/admin/testimonials"
                    routerLinkActive="bg-auto-accent text-white shadow-lg shadow-auto-accent/20"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 group">
                    <svg class="w-5 h-5 mr-3 transition-colors" routerLinkActive #rlt="routerLinkActive"
                        [class.text-white]="rlt.isActive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z">
                        </path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Testimonios</span>
                </a>

                <!-- Raffles (New) -->
                <a routerLink="/admin/raffles"
                    routerLinkActive="bg-auto-accent text-white shadow-lg shadow-auto-accent/20"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 group">
                    <svg class="w-5 h-5 mr-3 transition-colors" routerLinkActive #rlr="routerLinkActive"
                        [class.text-white]="rlr.isActive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z">
                        </path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Sorteos</span>
                </a>

                <!-- Inventory (New) -->
                <a routerLink="/admin/inventory"
                    routerLinkActive="bg-auto-accent text-white shadow-lg shadow-auto-accent/20"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 group">
                    <svg class="w-5 h-5 mr-3 transition-colors" routerLinkActive #rli="routerLinkActive"
                        [class.text-white]="rli.isActive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4">
                        </path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Inventario</span>
                </a>

                <!-- Inbox (New) -->
                <a routerLink="/admin/inbox"
                    routerLinkActive="bg-auto-accent text-white shadow-lg shadow-auto-accent/20"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 group">
                    <svg class="w-5 h-5 mr-3 transition-colors" routerLinkActive #rlig="routerLinkActive"
                        [class.text-white]="rlig.isActive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                        </path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Mensajes</span>
                </a>

                <!-- Users -->
                <a routerLink="/admin/users"
                    routerLinkActive="bg-auto-accent text-white shadow-lg shadow-auto-accent/20"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200 group">
                    <svg class="w-5 h-5 mr-3 transition-colors" routerLinkActive #rlu="routerLinkActive"
                        [class.text-white]="rlu.isActive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Usuarios</span>
                </a>
            </nav>

            <div class="p-3 border-t border-white/5 mt-auto">
                <button (click)="logout()"
                    class="flex items-center w-full px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all group">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                    <span class="font-black italic tracking-tighter">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <!-- Just an empty container that tells router outlet to fill remaining space -->
        <main class="flex-1 min-w-0">
            <!-- Optional: Wrap content in a subtle container if needed, or let component decide -->
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
