<div class="min-h-screen bg-auto-black flex flex-col md:flex-row">

    <!-- Sidebar -->
    <aside
        class="hidden md:flex flex-col fixed top-0 left-0 h-full bg-auto-carbon border-r border-white/5 z-20 w-64 pt-16">

        <div class="h-16 flex items-center px-6 border-b border-white/5 whitespace-nowrap overflow-hidden">
            <span class="text-xl font-bold text-white">
                TENSOR<span class="text-auto-accent">ADMIN</span>
            </span>
        </div>

        <nav class="flex-1 px-3 py-6 space-y-2 overflow-y-auto overflow-x-hidden">
            <!-- Dashboard -->
            <a routerLink="/admin/dashboard" routerLinkActive="text-white bg-white/5 border-r-2 border-auto-accent"
                class="flex items-center px-3 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition-colors group">
                <svg class="w-6 h-6 min-w-[24px] text-gray-500 group-hover:text-auto-accent transition-colors"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                    </path>
                </svg>
                <span class="ml-4 font-medium whitespace-nowrap">Dashboard</span>
            </a>

            <!-- Blog Posts -->
            <a routerLink="/admin/blog" routerLinkActive="text-white bg-white/5 border-r-2 border-auto-accent"
                class="flex items-center px-3 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition-colors group">
                <svg class="w-6 h-6 min-w-[24px] text-gray-500 group-hover:text-auto-accent transition-colors"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z">
                    </path>
                </svg>
                <span class="ml-4 font-medium whitespace-nowrap">Blog Posts</span>
            </a>

            <!-- Services -->
            <a routerLink="/admin/services" routerLinkActive="text-white bg-white/5 border-r-2 border-auto-accent"
                class="flex items-center px-3 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition-colors group">
                <svg class="w-6 h-6 min-w-[24px] text-gray-500 group-hover:text-auto-accent transition-colors"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span class="ml-4 font-medium whitespace-nowrap">Services CRM</span>
            </a>

            <!-- Testimonials -->
            <a routerLink="/admin/testimonials" routerLinkActive="text-white bg-white/5 border-r-2 border-auto-accent"
                class="flex items-center px-3 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition-colors group">
                <svg class="w-6 h-6 min-w-[24px] text-gray-500 group-hover:text-auto-accent transition-colors"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z">
                    </path>
                </svg>
                <span class="ml-4 font-medium whitespace-nowrap">Testimonials</span>
            </a>

            <!-- Users -->
            <a routerLink="/admin/users" routerLinkActive="text-white bg-white/5 border-r-2 border-auto-accent"
                class="flex items-center px-3 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition-colors group">
                <svg class="w-6 h-6 min-w-[24px] text-gray-500 group-hover:text-auto-accent transition-colors"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                <span class="ml-4 font-medium whitespace-nowrap">Users</span>
            </a>
        </nav>

        <div class="px-3 py-6 border-t border-white/5">
            <button (click)="logout()"
                class="flex items-center px-3 py-3 w-full text-sm text-gray-500 hover:text-white transition-colors group">
                <svg class="w-6 h-6 min-w-[24px] mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
                <span class="ml-4 font-medium whitespace-nowrap">Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 pt-6 md:pt-8 md:ml-64 transition-all duration-300 ease-in-out">
        <router-outlet></router-outlet>
    </main>
</div>
